# Every Julia file under test/ (other than runtests.jl) is listed here exactly once, by its
# path relative to test/ without `.jl`, including files in subdirectories; there are no
# patterns. test/runtests.jl stops before running anything when a file is unclassified, listed
# twice, or listed but missing (test/testsuite.jl). A test file also goes into test/impact.toml
# (scripts/ci_plan.jl checks that every file can be reached from a rule).
#
# A test file must run on its own: it declares every `using` it needs and does not rely on
# another file's definitions (workers are reused across files).

# Each runs in a fresh module on a worker process, concurrently with the others.
parallel = [
  "aqua",
  "ci_plan",
  "dependencies",
  "lasso",
  "lasso_intercept",
  "lasso_reference",
  "smoke",
  "sqrt_lasso",
  "statsapi",
  "testsuite_validation",
]

# Run one at a time after the parallel batch. None today: no test file needs a whole machine.
serial = []

# Each runs in a fresh child process with these flags added after the worker's own. None today.
[subprocess]

# Julia files that are not test files, each with the reason. A new helper or fixture file must
# be added here or to a list above like any other.
[not_tests]
"testsuite" = "this inventory's loader and checks (test/testsuite.jl)"
