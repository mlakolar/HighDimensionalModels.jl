# Which tests a change can affect: read by scripts/ci_plan.jl (CI and scripts/test_affected.jl).
#
# The planner takes the union of every rule that matches every changed path; the order of the
# rules does not matter. A path no rule matches selects the full suite, and so does a deleted or
# renamed source or test file. Every file under src/ must be matched by a full rule or by rules
# naming at least one family or test (scripts/ci_plan.jl checks this). `*` matches within a path
# segment, `**` across segments.
#
# Levels: none (no package tests) < focused < full (every test file). A rule selects its
# families and tests; full selects everything. `jobs` adds CI jobs: test (the test files, Linux),
# benchmark-integrity (Linux) and test-cross (macOS and Windows, which only the nightly and
# manual runs plan). A full plan runs test and benchmark-integrity.
#
# With a handful of test files, a change outside documentation and benchmark/ selects the full
# suite. A rule for a new family of source files narrows that by naming its tests.
#
# When a full run catches a failure that a selective run missed, fix the rule here and record it
# under [[miss]] at the end.

# Run with every plan that runs tests: the smoke test and the check of the dependency setup.
smoke = ["smoke", "dependencies"]
# Run whenever a file under src/ changes: the package-wide checks.
source = ["aqua"]

[families]
lasso = ["lasso", "lasso_reference", "statsapi"]
planner = ["ci_plan"]
inventory = ["testsuite_validation"]

[[rules]]
paths = ["src/**", "Project.toml"]
level = "full"
reason = "The package and its dependency bounds: every test."

[[rules]]
paths = ["test/**"]
level = "full"
reason = "Test files, their inventory and impact map, and the test runner: every test."

[[rules]]
paths = ["scripts/**", ".github/workflows/CI.yml"]
level = "full"
reason = "The dependency setup, the test and CI scripts and the CI workflow: every test and every Linux job."

[[rules]]
paths = ["benchmark/**"]
level = "none"
jobs = ["benchmark-integrity"]
reason = "The benchmark harness is not package code: no package test, but its integrity checks run."

[[rules]]
paths = ["docs/**", "**.md", "LICENSE", ".gitignore", ".github/workflows/Documentation.yml",
         ".github/workflows/CompatHelper.yml", ".github/workflows/TagBot.yml"]
level = "none"
reason = "Documentation and other workflows: no package test."

# ---- Known selection misses ---------------------------------------------------------------
# One entry per failure that a full run caught after a selective run missed it:
# [[miss]]
# commit = "<sha of the change>"
# test = "<test file that failed>"
# cause = "why the rule did not select it"
# fix = "the rule change (and the planner test reproducing it)"
